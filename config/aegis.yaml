# =====================================================================
# AEGIS central configuration
# ---------------------------------------------------------------------
# Every component (producers, Spark jobs, HBase scripts, API) reads this
# file through aegis.config.load_config(). Any value can be overridden
# with an environment variable named AEGIS__<SECTION>__<KEY> (double
# underscores separate nesting levels), e.g.
#   AEGIS__KAFKA__BOOTSTRAP_SERVERS=kafka:29092
#   AEGIS__HBASE__HOST=hbase
# No secrets are stored here; the local demo stack has no credentials.
# =====================================================================

project:
  name: AEGIS
  synthetic_label: "SYNTHETIC - generated by the AEGIS simulator; not real observations"

# Study region. Zones are a regular analysis grid over this bounding box.
# They are NOT official administrative boundaries.
region:
  name: "Chennai metropolitan area (demo bounding box)"
  min_lat: 12.85
  max_lat: 13.25
  min_lon: 80.10
  max_lon: 80.35
  grid_cell_deg: 0.05          # 0.05 deg ~ 5.5 km; 8 rows x 5 cols = 40 zones
  local_timezone: "Asia/Kolkata"
  # Zone fan-out for station observations (see docs/architecture.md, "Spatial model")
  weather_station_radius_km: 12.0   # zone uses its nearest weather station within this radius
  water_station_radius_km: 6.0      # zone uses its nearest river gauge within this radius

kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    weather: weather-events
    water_level: water-level-events
    traffic: traffic-events
    incidents: incident-reports
    zone_risk: zone-risk-updates
    data_quality: data-quality-events
  partitions: 3
  replication_factor: 1
  producer:
    acks: "all"
    enable_idempotence: true
    retries: 10
    retry_backoff_ms: 500
    delivery_timeout_ms: 60000
    linger_ms: 20
    compression_type: "lz4"
  api_consumer_group: "aegis-api-live"

spark:
  master: "local[8]"                 # batch jobs; capped so the whole stack fits an 8 GB Docker VM
  app_name: "AEGIS"
  shuffle_partitions: 8
  driver_memory: "1536m"
  log_level: "WARN"
  session_timezone: "UTC"

streaming:
  starting_offsets: "earliest"     # only used on the very first start; afterwards checkpoints decide
  trigger_seconds: 10
  watermark: "10 minutes"          # bounds dedup/aggregation state; older events are dropped by stateful operators
  window_duration: "5 minutes"     # tumbling event-time windows for zone aggregation
  max_offsets_per_trigger: 20000
  future_tolerance_minutes: 5      # events further in the future than this are rejected
  max_raw_value_chars: 2000        # quarantine keeps at most this many characters of a bad payload
  # Long-running job: bounded resources. local[*] on a 16-core host starts one Python
  # UDF worker per core (~55 MB each) on top of the JVM heap and exceeded the
  # container's 3 GB limit (JVM OOM-killed during verification). Micro-batches are small.
  spark_master: "local[4]"
  driver_memory: "1g"

storage:
  data_root: "data"                # relative to the project root unless absolute
  # All paths below are relative to data_root.
  generated_dir: "generated"
  reference_dir: "reference"
  lake_dir: "lake"
  checkpoint_dir: "checkpoints"
  state_dir: "state"
  reports_dir: "reports"
  models_dir: "models"
  dead_letter_dir: "dead_letter"

hbase:
  enabled: true
  host: "localhost"
  port: 9090
  timeout_ms: 20000
  batch_size: 500
  write_retries: 3
  retry_backoff_s: 2.0
  # If true a failed HBase write fails the micro-batch, so Spark retries it from
  # the checkpoint on restart (at-least-once; HBase puts are idempotent by row key).
  # If false the failure is logged and recorded in processing_metrics.
  fail_on_error: true

# ---------------------------------------------------------------------
# Rule-based zone risk score (independent of the ML model)
#   risk_score = 100 * sum(w_i * f_i for available i) / sum(w_i for available i)
# f_i is each indicator normalized to [0, 1] by a clamped linear ramp between
# `low` (-> 0) and `high` (-> 1). Weights and thresholds are DEMONSTRATION
# values chosen for this project, not validated hazard-science parameters.
# ---------------------------------------------------------------------
risk:
  features:
    rainfall:
      weight: 0.30
      input: rainfall_avg_mm_hr          # mean rainfall intensity in the window (mm/hr)
      low: 2.5                           # light rain or less contributes nothing
      high: 50.0                         # >= 50 mm/hr is treated as maximal
    water_level:
      weight: 0.25
      input: level_ratio_max             # max water level / station danger level
      low: 0.60
      high: 1.00
    incidents:
      weight: 0.20
      input: weighted_reports            # verified=1.0, unverified=0.5, rejected=0
      low: 0.0
      high: 5.0
    traffic:
      weight: 0.15
      input: disrupted_ratio             # share of traffic observations flagged disrupted
      low: 0.0
      high: 0.75
    historical:
      weight: 0.10
      input: historical_hazard_index     # zone's flood-related incident history, relative to the max zone
      low: 0.0
      high: 1.0
  report_weights:
    verified: 1.0
    unverified: 0.5
    rejected: 0.0
  # Missing indicators are excluded from both numerator and denominator, and they
  # lower `coverage` (= available weight / total weight). Missing never means safe.
  confidence:
    high: 0.85
    medium: 0.60
    low: 0.40                            # below this the assessment is "Insufficient data"
  categories:                            # lower bounds, checked from highest down
    Critical: 75
    High: 50
    Moderate: 25
    Low: 0

alerts:
  categories: ["High", "Critical"]       # zone-risk updates in these categories raise dashboard alerts
  max_recent: 50

# ---------------------------------------------------------------------
# Synthetic data generator (deterministic for a given seed)
# ---------------------------------------------------------------------
generator:
  seed: 42
  weather_stations: 12
  imperial_weather_stations: 4          # subset that reports in the imperial vendor format
  water_stations: 8
  traffic_segments: 30
  historical_days: 60
  historical_step_minutes: 15
  live_rate_per_sec: 4.0                # total events per second across all sources
  live_duration_sec: 0                  # 0 = run until stopped
  live_storm_cycle_minutes: 20          # one simulated storm passes over the region per cycle
  anomaly_rate: 0.06                    # share of live events that are deliberately defective
  historical_anomaly_rate: 0.02

# ---------------------------------------------------------------------
# Supporting Spark MLlib classifier (flood-incident severity)
# ---------------------------------------------------------------------
model:
  name: "flood_severity_dt"
  labels: ["Low", "Moderate", "High", "Critical"]
  features:                             # defined in spark_jobs/features.py (all known before the incident)
    - rain_3h_mm
    - rain_max_1h_mm_hr
    - level_ratio_max_3h
    - humidity_avg_3h
    - disrupted_ratio_1h
    - speed_ratio_avg_1h
    - reports_6h
    - water_obs_available
    - traffic_obs_available
  max_depth: 6
  min_instances_per_node: 5
  impurity: "gini"
  seed: 42
  test_fraction: 0.2                    # most recent 20% of incidents (time-based split)
  min_rows: 200
  # The live demo stream compresses ~6 h of simulated weather into
  # generator.live_storm_cycle_minutes, i.e. 18x for a 20-minute cycle. Live
  # inference therefore uses buckets of 3600/18 = 200 s so one bucket still
  # represents one simulated hour. Use 3600 for real-time data.
  live_bucket_seconds: 200
